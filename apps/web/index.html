<!doctype html>
<html lang="zh-CN" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>某医院导诊演示</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-portal="patient">
  <header class="topbar">
    <div class="portal-brand"><strong>某医院导诊演示</strong><span class="badge simulation-badge">模拟</span></div>
  </header>
  <main>
    <section id="view-patient" class="view active">
      <article class="card chat-card patient-conversation">
        <div class="section-head patient-chat-head"><div><h1>您好，需要我帮您做什么？</h1><p class="muted"></p></div><div class="patient-chat-controls"><button id="autoReadToggle" class="secondary" type="button" aria-pressed="true">🔊 自动朗读：开</button><button id="endPatientSession" class="danger hidden" type="button">结束本次就诊</button></div></div>
        <div id="chatMessages" class="messages" aria-live="polite"></div>
        <div class="quick-actions"><button type="button" data-quick-message="我想挂号">我要挂号</button><button type="button" data-quick-message="请打开院内地图我要查找地点">查找地点</button><button type="button" data-quick-message="请告诉我去哪里找工作人员">工作人员</button><button id="undoLastTurn" class="secondary" type="button" aria-label="撤销上一条输入">↶ 撤销上条</button></div>
        <form id="chatForm" class="inline-form patient-chat-form">
          <label class="sr-only" for="chatInput">输入问题</label>
          <input id="chatInput" maxlength="500" required>
          <button id="voiceInput" class="secondary voice-input" type="button" aria-pressed="false" aria-label="开始语音输入">🎙 语音</button>
          <button type="submit">发送</button>
        </form>
      </article>
    </section>
  </main>
  <dialog id="calledAlert" class="critical-dialog" aria-labelledby="calledAlertTitle">
    <div class="critical-dialog-icon" aria-hidden="true">!</div>
    <h2 id="calledAlertTitle">医生已叫号</h2>
    <p id="calledAlertMessage">请前往诊室就诊。</p>
    <button type="button" data-close-called>我知道了，立即前往</button>
  </dialog>
  <footer class="source-footer"><strong>非官方声明：</strong>本项目是独立导诊技术演示，不提供医院服务。页面使用的公开资料涉及绵阳市中心医院，资料来源为该院官网公开内容与地图数据，动态信息请向医院核实。</footer>
  <div id="toast" class="toast hidden" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
